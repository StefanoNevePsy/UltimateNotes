name: Build macOS app

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug) — compile check
        working-directory: macos
        run: swift build -c debug 2>&1 | tee build.log

      - name: Run tests
        working-directory: macos
        run: |
          if [ -d Tests ]; then swift test 2>&1 | tee test.log; else
            echo "no test target yet" | tee test.log
          fi

      - name: Package .app
        working-directory: macos
        run: |
          chmod +x scripts/make-app.sh
          ./scripts/make-app.sh release

      - name: Create .dmg
        working-directory: macos
        run: |
          hdiutil create -volname "Ultimate Notes" \
            -srcfolder "dist/Ultimate Notes.app" \
            -ov -format UDZO \
            "dist/UltimateNotes-mac-build${{ github.run_number }}.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultimatenotes-macos
          path: |
            macos/dist/*.dmg
            macos/build.log
            macos/test.log
