name: Build macOS app

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "macos/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug) — compile check
        working-directory: macos
        run: swift build -c debug 2>&1 | tee build.log

      - name: Run tests
        working-directory: macos
        run: |
          if [ -d Tests ]; then swift test 2>&1 | tee test.log; else
            echo "no test target yet" | tee test.log
          fi

      - name: Package .app
        working-directory: macos
        run: |
          chmod +x scripts/make-app.sh
          ./scripts/make-app.sh release

      - name: Create .dmg
        working-directory: macos
        run: |
          hdiutil create -volname "Ultimate Notes" \
            -srcfolder "dist/Ultimate Notes.app" \
            -ov -format UDZO \
            "dist/UltimateNotes-mac-build${{ github.run_number }}.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultimatenotes-macos
          path: |
            macos/dist/*.dmg
            macos/build.log
            macos/test.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-build-${{ github.run_number }}
          name: "Ultimate Notes per Mac — build ${{ github.run_number }}"
          body: |
            App macOS nativa, build automatica da `${{ github.ref_name }}`
            Commit: ${{ github.sha }}

            Scarica il `.dmg`, trascina l'app in Applicazioni e aprila.
            Al primo avvio macOS la blocca perché la firma è ad-hoc e non
            notarizzata: tasto destro sull'app ▸ **Apri**, poi conferma.

            Poi: `File ▸ Apri cartella vault…` e scegli la stessa cartella
            impostata sul tablet in Impostazioni ▸ Sincronizzazione.
          files: macos/dist/*.dmg
